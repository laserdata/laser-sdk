[package]
name = "laser-bench"
version = "0.0.1"
edition = "2024"
publish = false
rust-version = "1.97.1"
description = "Reproducible benchmark harness for LaserData SDK."

[workspace]

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"
futures = "0.3.33"
hdrhistogram = "7.6.0"
jsonschema = { version = "0.49.8", default-features = false }
laser-sdk = { path = "../sdk", features = ["agent", "managed", "mcp-http"] }
laser-wire = { path = "../wire", features = ["fixtures"] }
libc = "0.2.189"
minisign-verify = "0.2.5"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
rmcp = { version = "3.1.2", features = ["client", "reqwest", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
schemars = "1.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = "0.7.18"
tokio-util = "0.7.19"
toml = "1.1.4"

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"

[[bench]]
name = "micro"
harness = false

[lints.clippy]
pedantic = "deny"

# Match the Iggy fork's release policy so the in-process raw client is built
# with the same optimization level as the external iggy-bench and server
# binaries it is compared against.
[profile.release]
codegen-units = 1
lto = true
