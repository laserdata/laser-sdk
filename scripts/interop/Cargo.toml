[package]
name = "laser-interop"
edition = "2024"
version = "0.0.0"
publish = false

# Its own workspace root, so this tool stays out of the repository workspace.
# It exists to be driven by the Go live suite rather than to ship, and a member
# of the workspace would be built by every `cargo build` in the repository.
[workspace]

[dependencies]
iggy = "0.12.0"
laser-sdk = { path = "../../sdk" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
