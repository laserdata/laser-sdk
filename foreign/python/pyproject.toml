[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "laser-sdk"
description = "Durable workflows and long-term memory for AI agents, with sessions, key-value state, operational query and typed streaming on Apache Iggy."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "LaserData" }]
keywords = ["laserdata", "iggy", "streaming", "agents", "agentic", "ai"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://laserdata.com"
Documentation = "https://docs.laserdata.com/laser-sdk"
Repository = "https://github.com/laserdata/laser-sdk"
Issues = "https://github.com/laserdata/laser-sdk/issues"

[project.optional-dependencies]
examples = ["protobuf>=5,<8", "cbor2>=5,<7"]
testing = [
    "maturin>=1.7,<2.0",
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "pytest-bdd>=9.0,<10.0",
    "pytest-timeout>=2.0,<3.0",
    "ruff>=0.6,<1.0",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "laser_sdk"
include = [{ path = "laser_sdk.pyi", format = "sdist" }]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
    { file = "laser_sdk.pyi" },
    { file = "../../Cargo.toml" },
    { file = "../../rust-toolchain.toml" },
    { file = "../../sdk/**/*" },
    { file = "../../wire/**/*" },
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
timeout = 60
testpaths = ["tests"]
markers = [
    "bridges: edge bridge interoperability scenarios",
    "integration: tests that need the pinned VSR Iggy server",
    "unit: fast tests with no server",
]
