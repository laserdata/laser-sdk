name: ci-go

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "go-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

defaults:
  run:
    shell: bash
    working-directory: foreign/go

jobs:
  # Decide whether this change can affect the Go client at all. It reads the
  # fixture corpus and the contract crate's sources, so a change to either is
  # meaningful even when no Go file moved.
  flags:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    outputs:
      run_ci: ${{ steps.decide.outputs.run_ci }}
      server_tests: ${{ steps.decide.outputs.server_tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether the Go gates run
        id: decide
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          run_ci=run
          server_tests=run
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            # A change that pins a server release before it is published
            # carries [wire-break] for a breaking wire change or
            # [skip-server] for a compatible one. Only bdd-go resolves that
            # release, so only bdd-go steps aside; every other gate runs.
            for text in "${PR_TITLE}" "${PR_BODY}" "${COMMIT_MESSAGE}"; do
              if [[ "${text}" == *"[wire-break]"* || "${text}" == *"[skip-server]"* ]]; then
                server_tests=skip
              fi
            done

            if [[ "${EVENT_NAME}" == "pull_request" || "${EVENT_NAME}" == "push" ]] &&
              git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              meaningful_paths="$(
                git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" |
                  grep -E '^foreign/go/|^examples/go/|^bdd/(go|scenarios)/|^wire/|^sdk/|^scripts/interop/|^Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^justfile$|^README\.md$|^\.github/workflows/ci-go\.yml$|^scripts/check-parity\.py$|^scripts/run-with-test-iggy\.mjs$|^scripts/resolve-test-iggy-server\.sh$|^scripts/run-(bdd-tests|managed-bdd)\.sh$|^scripts/run-with-recovering-catalog\.py$|^foreign/python/iggy_test_server\.py$|^scripts/ci/apt-install\.sh$|^scripts/ci/go-managed\.compose\.yaml$|^scripts/ci/go-bdd-coverage\.py$' || true
              )"
              if [[ -z "${meaningful_paths}" ]]; then
                run_ci=skip
              fi
            fi
          fi
          echo "Go CI: ${run_ci}, server-backed scenarios: ${server_tests}"
          echo "run_ci=${run_ci}" >> "${GITHUB_OUTPUT}"
          echo "server_tests=${server_tests}" >> "${GITHUB_OUTPUT}"

  quality:
    name: quality
    needs: [flags]
    if: needs.flags.outputs.run_ci == 'run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: foreign/go/go.sum
      - name: Verify the module release version
        working-directory: ${{ github.workspace }}
        run: |
          python3 - <<'PYTHON'
          import os
          import pathlib
          import re
          import tomllib

          version = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          source = pathlib.Path("foreign/go/laser/version.go").read_text()
          if not re.search(rf'^const ClientVersion = "{re.escape(version)}"$', source, re.MULTILINE):
              raise SystemExit("Go ClientVersion must equal the workspace version " + version)
          if os.environ["GITHUB_REF_TYPE"] == "tag" and os.environ["GITHUB_REF_NAME"] != "go-v" + version:
              raise SystemExit("Go release tag must be go-v" + version)
          PYTHON
      - name: Parity matrix
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m unittest scripts/test_check_parity.py
          python3 scripts/check-parity.py
      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "gofmt would rewrite:"
            echo "${unformatted}"
            exit 1
          fi
      - run: go vet ./...
      - name: Module file is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go build ./...
      # The examples and the conformance runner are modules of their own, so
      # they are gated here too: a client change that breaks either should
      # fail now rather than when someone next runs an example.
      - name: Examples and the conformance runner
        working-directory: ${{ github.workspace }}
        run: |
          for module in examples/go bdd/go; do
            ( cd "${module}"
              unformatted="$(gofmt -l .)"
              if [[ -n "${unformatted}" ]]; then
                echo "gofmt would rewrite in ${module}:"
                echo "${unformatted}"
                exit 1
              fi
              go vet ./...
              go build ./...
              # Tidiness is checked here too, not only for foreign/go. These
              # are separate modules with their own requirements, and an
              # import added to one of them leaves its go.mod stale without
              # the client's own ever noticing -- which is exactly how
              # bdd/go came to carry iggy as indirect while importing it
              # directly.
              go mod tidy
              git diff --exit-code -- go.mod go.sum
              go test ./... -count=1
            )
          done

      - name: Build the README program as an external module consumer
        working-directory: ${{ github.workspace }}
        run: |
          module=github.com/laserdata/laser-sdk/foreign/go
          version="v$(sed -n 's/^const ClientVersion = "\(.*\)"$/\1/p' foreign/go/laser/version.go)"
          proxy="$RUNNER_TEMP/laser-proxy"
          package_dir="$proxy/$module/@v"
          consumer="$RUNNER_TEMP/laser-consumer"
          mkdir -p "$package_dir" "$consumer"
          git archive --format=zip --prefix="$module@$version/" -o "$package_dir/$version.zip" HEAD:foreign/go
          cp foreign/go/go.mod "$package_dir/$version.mod"
          jq -n --arg version "$version" --arg time "$(git show -s --format=%cI HEAD)" \
            '{Version: $version, Time: $time}' > "$package_dir/$version.info"
          awk '/^```go$/ {copy=1; next} /^```$/ {copy=0} copy' README.md > "$consumer/main.go"
          cd "$consumer"
          go mod init example.org/consumer
          module_cache="$(go env GOMODCACHE)"
          upstream_proxy="$(go env GOPROXY)"
          # Go keys compiled packages of a module by its version, so a restored
          # build cache would serve an older build of this same version.
          export GOMODCACHE="$RUNNER_TEMP/laser-consumer-modules" GONOSUMDB="$module"
          export GOCACHE="$RUNNER_TEMP/laser-consumer-build"
          export GOPROXY="file://$proxy,file://$module_cache/cache/download,$upstream_proxy"
          go get "$module@$version"
          go build -mod=mod .

  # The minimum the module declares, the previous stable release and the
  # current one. A client is consumed by applications on all three.
  unit:
    name: unit-go-${{ matrix.go }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        go:
          - "1.25.0"
          - oldstable
          - stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: foreign/go/go.sum
      - name: Test all modules at this Go version
        working-directory: ${{ github.workspace }}
        run: |
          for module in foreign/go examples/go bdd/go; do
            (cd "$module" && go test ./... -count=1)
          done

  # The contract is pinned by shared corpora that several goroutines may
  # evaluate at once, so the suite runs under the race detector too.
  race:
    name: race
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: foreign/go/go.sum
      - run: go test ./... -race -count=1
      - run: go test ./internal/cborform -run=^$ -fuzz=^FuzzDecode$ -fuzztime=15s

  wire-differential:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: foreign/go/go.sum
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Compare Go wire vectors with Rust
        env:
          LASER_GO_VECTORS: ${{ runner.temp }}/go-vectors
        run: |
          mkdir -p "$LASER_GO_VECTORS"
          go test ./wire -run Export -count=1
          cargo test --locked -p laser-wire --features cbor --test go_differential

  vulnerabilities:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: foreign/go/go.sum
      - name: Check reachable vulnerabilities across modules
        working-directory: ${{ github.workspace }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          for module in foreign/go examples/go bdd/go; do
            (cd "$module" && govulncheck -test ./...)
          done

  # Cross-SDK BDD conformance: the Go runner executes the shared Gherkin
  # scenarios against the pinned Iggy release, through the same helper the
  # TypeScript runner uses. scripts/run-with-test-iggy.mjs resolves the
  # release scripts/resolve-test-iggy-server.sh pins, starts one on a free
  # port, exports LASER_CONNECTION_STRING for the child, and tears it down --
  # so Go tests the same server version as every other SDK rather than a
  # server of its own.
  #
  # Every job above proves the client against in-process fakes, which cannot
  # see whether a real server accepts what the client sends. The first live
  # run of bdd/go found three real bugs the whole hermetic suite was blind
  # to, one of which -- Topic.ConsumerGroup never creating the group -- made
  # Laser.SpawnAgent unusable against any real deployment.
  #
  # The @managed scenarios still skip here: they need a managed LaserData
  # deployment that folds the managed surfaces, and the pinned release is
  # open Apache Iggy.
  bdd-go:
    name: bdd-go
    needs: [flags, quality]
    if: needs.flags.outputs.run_ci == 'run' && needs.flags.outputs.server_tests == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: bdd/go/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scripts/interop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Iggy runtime dependencies
        working-directory: ${{ github.workspace }}
        run: scripts/ci/apt-install.sh libhwloc15
      - name: BDD scenarios (Go runner)
        working-directory: bdd/go
        run: node ../../scripts/run-with-test-iggy.mjs go test ./... -count=1
      - name: Read from a recovering catalog
        working-directory: bdd/go
        run: |
          python3 ../../scripts/run-with-recovering-catalog.py go test ./... -count=1 -json |
            python3 ../../scripts/ci/go-bdd-coverage.py record "$RUNNER_TEMP/recovering.json"
      - uses: actions/upload-artifact@v7
        with:
          name: go-bdd-recovering
          path: ${{ runner.temp }}/recovering.json
      - name: Live streaming and Rust interoperability
        run: node ../../scripts/run-with-test-iggy.mjs go test -tags integration ./laser -count=1 -timeout=20m

  managed:
    name: managed Go scenarios
    needs: [flags, quality]
    if: needs.flags.outputs.server_tests == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: laser-go-ci
      LASER_BIND_ADDRESS: 127.0.0.1
      LASER_IGGY_PORT: "8090"
      LASER_IGGY_USERNAME: iggy
      LASER_IGGY_PASSWORD: iggy
      LASER_PLANE_INTERNAL_API_TOKEN: local-go-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: laserdata/laser-stack
          path: .laser-stack
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: bdd/go/go.sum
      # The managed backend refuses a volume whose filesystem disables write
      # barriers, and the hosted runner disk under Docker's data root is
      # mounted `nobarrier`.
      - name: Enable write barriers for Docker volumes
        working-directory: ${{ github.workspace }}
        run: |
          docker_root="$(docker info --format '{{.DockerRootDir}}')"
          mount_point="$(findmnt --noheadings --output TARGET --target "${docker_root}")"
          sudo mount -o remount,barrier "${mount_point}"
          options="$(findmnt --noheadings --output OPTIONS --target "${docker_root}")"
          echo "${mount_point}: ${options}"
          if [[ ",${options}," == *,nobarrier,* || ",${options}," == *,barrier=0,* ]]; then
            echo "write barriers are still disabled on ${mount_point}" >&2
            exit 1
          fi
      - name: Start Laser Stack
        id: stack
        working-directory: .laser-stack
        run: |
          cp ../scripts/ci/go-managed.compose.yaml compose.override.yaml
          ./scripts/up
      - name: Verify the stack runs the pinned server
        working-directory: ${{ github.workspace }}
        run: |
          pinned="$(scripts/resolve-test-iggy-server.sh --version)"
          container="$(docker compose --project-directory .laser-stack ps -q iggy)"
          image="$(docker inspect --format '{{.Image}}' "${container}")"
          running="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "${image}")"
          if [[ "${running}" != "${pinned}" ]]; then
            echo "Laser Stack runs Iggy ${running}, the test pin is ${pinned}" >&2
            exit 1
          fi
      - name: Run managed conformance
        working-directory: bdd/go
        env:
          LASER_BDD_ADDR: 127.0.0.1:8090
          LASER_BDD_MANAGED: "1"
          LASER_BDD_SQL_BACKEND: postgres
        run: |
          go test ./... -count=1 -timeout=25m -json |
            python3 ../../scripts/ci/go-bdd-coverage.py record "$RUNNER_TEMP/managed.json"
      - uses: actions/upload-artifact@v7
        with:
          name: go-bdd-managed
          path: ${{ runner.temp }}/managed.json
      - name: Stop Laser Stack
        if: always() && steps.stack.outcome == 'success'
        working-directory: .laser-stack
        run: ./scripts/down

  upstream:
    name: upstream Apache Iggy
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      iggy:
        image: apache/iggy:0.10.0
        ports:
          - 8090:8090
        env:
          IGGY_ROOT_USERNAME: iggy
          IGGY_ROOT_PASSWORD: iggy
          IGGY_TCP_ADDRESS: 0.0.0.0:8090
          IGGY_NODE_ADVERTISED_ADDRESS: 127.0.0.1
          IGGY_SHARDING_CPU_ALLOCATION: "2"
          IGGY_SHARDING_PIN_CORES: "false"
          IGGY_SHARDING_RECONCILE_PERIODIC_INTERVAL: 200 ms
          IGGY_CONSUMER_GROUP_REBALANCING_TIMEOUT: 1s
        options: >-
          --security-opt seccomp=unconfined
          --health-cmd "bash -c '</dev/tcp/127.0.0.1/8090'"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: bdd/go/go.sum
      - name: BDD against the original server
        working-directory: bdd/go
        env:
          LASER_BDD_ADDR: 127.0.0.1:8090
        run: |
          go test ./... -count=1 -json |
            python3 ../../scripts/ci/go-bdd-coverage.py record "$RUNNER_TEMP/upstream.json"
      - uses: actions/upload-artifact@v7
        with:
          name: go-bdd-upstream
          path: ${{ runner.temp }}/upstream.json

  ci-go-complete:
    name: ci-go-complete
    if: always()
    needs:
      - flags
      - quality
      - unit
      - race
      - bdd-go
      - wire-differential
      - vulnerabilities
      - upstream
      - managed
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v7
        if: needs.flags.outputs.run_ci == 'run' && needs.flags.outputs.server_tests == 'run'
      - uses: actions/download-artifact@v8
        if: needs.flags.outputs.run_ci == 'run' && needs.flags.outputs.server_tests == 'run'
        with:
          pattern: go-bdd-*
          merge-multiple: true
          path: ${{ runner.temp }}/go-bdd
      - name: Require a passing deployment for every shared scenario
        if: needs.flags.outputs.run_ci == 'run' && needs.flags.outputs.server_tests == 'run'
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci/go-bdd-coverage.py check "$RUNNER_TEMP"/go-bdd/{upstream,managed,recovering}.json

  publish:
    name: publish Go module tag
    needs: [quality, unit, race, wire-differential, vulnerabilities, bdd-go, upstream, managed, ci-go-complete]
    if: startsWith(github.ref, 'refs/tags/go-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish the version Go resolves for the submodule
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          module_tag="foreign/go/${GITHUB_REF_NAME#go-}"
          revision="$(git rev-parse HEAD)"
          if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${module_tag}" -f "sha=${revision}"; then
            existing="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${module_tag}" --jq .sha)"
            if [[ "${existing}" != "${revision}" ]]; then
              echo "${module_tag} already points to a different revision" >&2
              exit 1
            fi
          fi
