name: ci-typescript

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "ts-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

defaults:
  run:
    working-directory: foreign/typescript

jobs:
  # Decide whether the Iggy-server-backed suites run. A change carrying
  # `[wire-break]` in its title, body, or commit message is a breaking wire
  # change whose matching server release does not exist yet: the server-free
  # gates still run and only the live suites skip. Release tags always run
  # everything.
  flags:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    outputs:
      run_ci: ${{ steps.decide.outputs.run_ci }}
      server_tests: ${{ steps.decide.outputs.server_tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide the server-backed test mode
        id: decide
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          run_ci=run
          mode=run
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            for text in "${PR_TITLE}" "${PR_BODY}" "${COMMIT_MESSAGE}"; do
              if [[ "${text}" == *"[wire-break]"* ]]; then
                mode=skip
              fi
            done

            if [[ "${EVENT_NAME}" == "pull_request" || "${EVENT_NAME}" == "push" ]] &&
              git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              meaningful_paths="$(
                git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" |
                  grep -Ev '(^|/)[^/]+\.mdx?$|^docs/|^scripts/|^\.agents/|^\.claude/|^\.codex/|^\.github/|^foreign/python/pyproject\.toml$' || true
              )"
              pyproject_changes="$(
                git diff --unified=0 "${BASE_SHA}" "${HEAD_SHA}" -- foreign/python/pyproject.toml |
                  grep -E '^[+-]' |
                  grep -Ev '^(---|\+\+\+|[+-]description = )' || true
              )"
              if [[ -z "${meaningful_paths}" && -z "${pyproject_changes}" ]]; then
                run_ci=skip
              fi
            fi
          fi
          echo "TypeScript CI: ${run_ci}"
          echo "server-backed suites: ${mode}"
          echo "run_ci=${run_ci}" >> "${GITHUB_OUTPUT}"
          echo "server_tests=${mode}" >> "${GITHUB_OUTPUT}"

  quality:
    name: quality
    needs: [flags]
    if: needs.flags.outputs.run_ci == 'run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: foreign/typescript/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=high

  unit-node:
    name: unit-node-${{ matrix.node }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22.14.0"
          - "24"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: foreign/typescript/package-lock.json
      - run: npm ci
      - run: npm run build:test
      - run: npm test

  integration-iggy:
    name: integration-iggy
    needs: [quality, flags]
    if: needs.flags.outputs.server_tests == 'run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Iggy runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhwloc15
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: foreign/typescript/package-lock.json
      - run: npm ci
      - run: npm run test:integration

  pack:
    name: pack
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: foreign/typescript/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run pack:check
      - run: mkdir -p package
      - run: npm pack --json --pack-destination package
      - run: node scripts/pack-consumer-check.mjs package/laserdata-laser-sdk-*.tgz
      - run: npm run sbom -- package/sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: laser-sdk-npm-package
          path: |
            foreign/typescript/package/*.tgz
            foreign/typescript/package/sbom.cdx.json
          if-no-files-found: error

  bdd-typescript:
    name: bdd-typescript
    needs: [pack, flags]
    if: needs.flags.outputs.server_tests == 'run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Iggy runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhwloc15
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: bdd/typescript/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: laser-sdk-npm-package
          path: package
      - run: npm ci
        working-directory: bdd/typescript
      - run: npm install --no-save --ignore-scripts ../../package/laserdata-laser-sdk-*.tgz
        working-directory: bdd/typescript
      - run: npm run build
        working-directory: bdd/typescript
      - name: Prepare Cucumber report
        run: |
          mkdir -p reports
          printf '[]\n' > reports/cucumber.json
        working-directory: bdd/typescript
      - run: node ../../scripts/run-with-test-iggy.mjs npx cucumber-js --config cucumber.js --format progress --format json:reports/cucumber.json
        working-directory: bdd/typescript
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: typescript-cucumber-report
          path: bdd/typescript/reports/cucumber.json
          if-no-files-found: error

  examples:
    name: examples
    needs: [pack, flags]
    if: needs.flags.outputs.server_tests == 'run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Iggy runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhwloc15
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: examples/typescript/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: laser-sdk-npm-package
          path: package
      - run: npm ci
        working-directory: examples/typescript
      - run: npm install --no-save --ignore-scripts ../../package/laserdata-laser-sdk-*.tgz
        working-directory: examples/typescript
      - run: npm run typecheck
        working-directory: examples/typescript
      - run: npm test
        working-directory: examples/typescript
        env:
          LASER_MESSAGES: "24"
          LASER_BATCH: "8"

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/ts-v')
    needs:
      - quality
      - unit-node
      - integration-iggy
      - bdd-typescript
      - examples
      - pack
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: laser-sdk-npm-package
          path: foreign/typescript/package
      - run: npm install --global npm@12.0.1
      - run: node scripts/validate-release.mjs package/laserdata-laser-sdk-*.tgz "${GITHUB_REF_NAME}"
      - run: node scripts/publish-release.mjs package/laserdata-laser-sdk-*.tgz "${GITHUB_REF_NAME}"

  ci-typescript-complete:
    name: ci-typescript-complete
    if: always()
    needs:
      - flags
      - quality
      - unit-node
      - integration-iggy
      - bdd-typescript
      - examples
      - pack
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
        working-directory: ${{ github.workspace }}
