name: security-typescript

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
      - "docs/**"
      - "scripts/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
      - "docs/**"
      - "scripts/**"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later

  release-age:
    name: release-age
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: foreign/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
      # Cooldown gate: a lockfile change may only introduce dependency versions
      # that have been on the registry for at least seven days.
      - run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
      - run: git show "origin/${{ github.base_ref }}:foreign/typescript/package-lock.json" > /tmp/base-package-lock.json
      - run: node scripts/release-age-check.mjs /tmp/base-package-lock.json

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4

  audit:
    name: npm-audit-license-sbom
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foreign/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: foreign/typescript/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
      - run: npm run license:check
      - run: npm run sbom
      - uses: actions/upload-artifact@v7
        with:
          name: laser-sdk-typescript-sbom
          path: foreign/typescript/artifacts/sbom.cdx.json
          if-no-files-found: error

  osv:
    name: osv
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: ./
    permissions:
      actions: read
      contents: read
      security-events: write

  osv-pr:
    name: osv-pr
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.3.8
    with:
      scan-args: ./
    permissions:
      actions: read
      contents: read
      security-events: write
